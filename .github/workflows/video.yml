name: video
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      topic:
        description: Video topic
        required: true
      style:
        type: choice
        options: [drawn, vector]
        default: drawn
      scenes:
        description: Number of scenes (use 3 to test)
        default: "45"
concurrency:
  group: video
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'video:'))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config
      - run: pip install -r requirements.txt
      - name: Build video
        env:
          TOPIC: ${{ github.event.inputs.topic }}
          STYLE: ${{ github.event.inputs.style || 'drawn' }}
          SCENES: ${{ github.event.inputs.scenes || '45' }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python -m pipeline.run
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            build/final.mp4
            build/script.json
          retention-days: 14
      - name: Notify issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          STATUS: ${{ job.status }}
        run: |
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$STATUS" = "success" ]; then
            MSG="Video ready. Download 'video' from the Artifacts section of this run: $RUN"
          else
            MSG="Build failed. Re-run the failed job from here: $RUN"
          fi
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$MSG"
